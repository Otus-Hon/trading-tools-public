name: Windows public deployment checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      NODE_ENV: "production"
      TRADING_TOOLS_PUBLIC_MODE: "1"
      NEXT_PUBLIC_TRADING_TOOLS_PUBLIC_MODE: "1"
      FUTU_HOST: "127.0.0.1"
      FUTU_PORT: "11111"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Verify build dependencies are present
        run: npm ls --include=dev @tailwindcss/postcss typescript
      - name: Verify SQLite ABI and connection
        shell: powershell
        run: |
          npm run ensure:sqlite
          $env:TRADING_TOOLS_DATA_DIR = Join-Path $env:RUNNER_TEMP "trading-tools-data"
          node .\scripts\verify_runtime_access.js
      - name: Build public release
        run: npm run build
      - name: Run public-security integration tests
        run: npm run test:public-security
      - name: Parse deployment scripts and verify SecureString handoff
        shell: powershell
        run: |
          Get-ChildItem .\deploy\windows\*.ps1 | ForEach-Object {
            [void][ScriptBlock]::Create((Get-Content $_.FullName -Raw))
          }
          foreach ($command in @(
            "Get-ScheduledTask", "Register-ScheduledTask", "Start-ScheduledTask",
            "Stop-ScheduledTask", "Unregister-ScheduledTask"
          )) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Required Windows ScheduledTasks command is unavailable: $command"
            }
          }
          $testUser = "TTCI$($env:GITHUB_RUN_ATTEMPT)$([Guid]::NewGuid().ToString('N').Substring(0, 8))"
          $credentialPath = "C:\TradingTools\config\$testUser.credential.xml"
          $testTask = "TradingToolsIdentityCI$([Guid]::NewGuid().ToString('N').Substring(0, 8))"
          try {
            $credential = & .\deploy\windows\get-service-credential.ps1 `
              -ServiceUser $testUser `
              -CredentialPath $credentialPath
            $reloaded = & .\deploy\windows\get-service-credential.ps1 `
              -ServiceUser $testUser `
              -CredentialPath $credentialPath
            if ($reloaded.GetNetworkCredential().Password.Length -lt 48) { throw "Generated password is too short." }
            & .\deploy\windows\setup-service-account.ps1 -UserName $testUser -Password $reloaded.Password
            $member = Get-LocalGroupMember -Group (Get-LocalGroup -SID "S-1-5-32-544") -ErrorAction SilentlyContinue |
              Where-Object { $_.SID.Value -eq (Get-LocalUser -Name $testUser).SID.Value }
            if ($member) { throw "Test service account unexpectedly has administrator membership." }
            $testSid = (Get-LocalUser -Name $testUser).SID.Value
            $credentialAccess = (Get-Acl $credentialPath).Access | Where-Object {
              $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value -eq $testSid
            }
            if ($credentialAccess) { throw "Service account can read its protected credential file." }
            $taskUser = (Get-LocalUser -Name $testUser).SID.Translate([Security.Principal.NTAccount]).Value
            $taskPassword = $reloaded.GetNetworkCredential().Password
            $taskAction = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c exit 0"
            Register-ScheduledTask `
              -TaskName $testTask `
              -Action $taskAction `
              -User $taskUser `
              -Password $taskPassword `
              -RunLevel Limited `
              -Force | Out-Null
            $registeredTask = Get-ScheduledTask -TaskName $testTask
            $registeredSid = ([Security.Principal.NTAccount]$registeredTask.Principal.UserId).Translate([Security.Principal.SecurityIdentifier]).Value
            if ($registeredSid -ne $testSid) { throw "Scheduled Task principal does not match the local service account." }
          } finally {
            Unregister-ScheduledTask -TaskName $testTask -Confirm:$false -ErrorAction SilentlyContinue
            Remove-LocalUser -Name $testUser -ErrorAction SilentlyContinue
            Remove-Item $credentialPath -Force -ErrorAction SilentlyContinue
            $taskPassword = $null
            $credential = $null
            $reloaded = $null
          }
